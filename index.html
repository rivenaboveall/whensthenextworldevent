<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>when's the next world event?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/images/Traan.webp">
  <link rel="preload" as="image" href="assets/images/BattleRoyale.webp">
  <link rel="preload" as="image" href="assets/images/Carnival.webp">
  <link rel="preload" as="image" href="assets/images/Parasol.webp">
  <link rel="preload" as="image" href="assets/images/CindersOfEtris.webp">
  <link rel="preload" as="image" href="assets/images/Caeranthil.webp">
  <link rel="stylesheet" href="src/components/default.css?v=3">
  <link rel="stylesheet" href="src/components/mobile.css?v=3" media="(max-width: 960px)">
</head>

<body>
  <div id="bg-backdrop" class="bg-backdrop" aria-hidden="true">
    <div id="bg-image" class="bg-image"></div>
    <div id="bg-disaster-wrapper" class="bg-disaster-wrapper">
      <div id="bg-image-disaster" class="bg-image bg-image-disaster"></div>
    </div>
    <div id="bg-slash-line" class="bg-slash-line"></div>
    <div class="bg-overlay"></div>
    <div id="bg-black-curtain" class="bg-black-curtain"></div>
  </div>

  <header class="top-bar">
    <div class="top-bar-left">
      <button id="burger-menu-btn" class="nav-btn burger-btn" type="button"
        aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="side-menu-dropdown">
        <svg class="burger-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <button id="test-event-btn" class="nav-btn test-event-btn layout-hidden" type="button"
        data-hover-text="Test transition to the next World Event (Localhost only)">
        Test Event
      </button>

      <div id="side-menu-dropdown" class="menu-dropdown layout-hidden" role="menu">
        <div id="menu-group-worldevents" class="menu-group">
          <button id="menu-item-disasters" class="menu-item" type="button" role="menuitem"
            data-hover-text="Show Disasters happening in the Etrean Luminant along with the current World Events">
            <span class="menu-item-text">Etrean Luminant Disasters</span>
            <span id="menu-disasters-status" class="menu-item-status status-active">Shown</span>
          </button>
          <button id="menu-item-remind-we" class="menu-item" type="button" role="menuitem"
            data-hover-text="Play a sound cue and a desktop notification when the next event happens.">
            <span class="menu-item-text">Remind Me (World Events)</span>
            <span id="menu-remind-we-status" class="menu-item-status">Off</span>
          </button>
          <button id="menu-item-mute-soundtrack-we" class="menu-item menu-item-soundtrack" type="button" role="menuitem"
            data-hover-text="Globally mute the soundtrack that plays based on the current event's theme">
            <span class="menu-item-text">Mute Soundtrack</span>
            <span class="menu-soundtrack-status menu-item-status">Unmuted</span>
          </button>
        </div>

        <div id="menu-group-traan" class="menu-group layout-hidden">
          <button id="menu-item-remind-traan" class="menu-item" type="button" role="menuitem"
            data-hover-text="Play a sound cue and a desktop notification when the next event happens.">
            <span class="menu-item-text">Remind Me (Traan Zakshun)</span>
            <span id="menu-remind-traan-status" class="menu-item-status">Off</span>
          </button>
          <button id="menu-item-mute-soundtrack-traan" class="menu-item menu-item-soundtrack" type="button" role="menuitem"
            data-hover-text="Globally mute the soundtrack that plays based on the current event's theme">
            <span class="menu-item-text">Mute Soundtrack</span>
            <span class="menu-soundtrack-status menu-item-status">Unmuted</span>
          </button>
        </div>
      </div>
    </div>
    <div class="top-bar-right">
      <button id="layout-switch-btn" class="nav-btn layout-switch-btn" type="button" aria-label="Switch Layout"
        data-hover-text="Switch to Traan's Hourly Market and Black Market Rotation, Info is fetched from the Deepwoken Info Discord Server.">
        <span id="layout-switch-label">Switch to Traan Zakshun's Rotation</span>
      </button>
    </div>
  </header>

  <main class="center-container">
    <div id="events-grid" class="events-grid">
      <section class="event-column world-event-column">
        <div class="event-preview-container">
          <div class="preview-item">
            <span class="preview-prefix">Past Event:</span>
            <span id="past-event-name" class="event-gradient-text"></span>
          </div>
        </div>

        <div class="current-event-container">
          <h1 id="current-event-name" class="current-event-title event-gradient-text"></h1>
          <h2 id="join-status" class="join-status-heading">Time Left to join: --</h2>
        </div>

        <div class="mobile-timer-container">
          <div id="main-mobile-timer" class="mobile-timer"></div>
        </div>
      </section>

      <section id="disaster-section" class="event-column disaster-column">
        <div class="event-preview-container">
          <div class="preview-item">
            <span class="preview-prefix">Past Disaster:</span>
            <span id="past-disaster-name" class="event-gradient-text"></span>
          </div>
        </div>

        <div class="current-event-container">
          <h1 id="current-disaster-name" class="current-event-title event-gradient-text"></h1>
        </div>

        <div class="mobile-timer-container">
          <div id="disaster-mobile-timer" class="mobile-timer"></div>
        </div>
      </section>
    </div>

    <div id="traan-stock-layout" class="traan-layout layout-hidden">
      <h1 class="current-event-title event-gradient-text gradient-traan text-glow-traan">Work in Progress</h1>
    </div>
  </main>

  <div id="bottom-timers-container" class="bottom-timers-container">
    <div id="bottom-timers-grid" class="bottom-timers-grid">
      <div class="timer-column world-timer-column">
        <div class="timer-block">
          <div id="main-timer" class="next-event-timer-label">Next Event in --</div>
          <div class="next-event-preview">
            <span class="preview-prefix">Next Event:</span>
            <span id="next-event-name" class="event-gradient-text"></span>
          </div>
        </div>
      </div>
      <div id="disaster-timer-column" class="timer-column disaster-timer-column">
        <div id="disaster-timer-block" class="timer-block">
          <div id="disaster-timer" class="next-event-timer-label">Next Disaster in --</div>
          <div class="next-event-preview">
            <span class="preview-prefix">Next Disaster:</span>
            <span id="next-disaster-name" class="event-gradient-text"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="cursor-hover-box" class="cursor-hover-box" aria-hidden="true"></div>

  <script src="src/layouts/worldevents.js?v=4"></script>
  <script src="src/layouts/traanstock.js?v=4"></script>
  <script src="src/musicplayer.js?v=4"></script>
  <script src="src/main.js?v=4"></script>
</body>

</html>
