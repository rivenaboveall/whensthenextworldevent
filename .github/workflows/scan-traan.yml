name: Scan/Update Traan Stock

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Bot Token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - name: Cache APT packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: .apt-cache
          key: apt-tesseract-${{ runner.os }}

      - name: Install APT Dependencies
        run: |
          mkdir -p .apt-cache
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
            sudo apt-get install -y --download-only tesseract-ocr libtesseract-dev
            cp -n /var/cache/apt/archives/*.deb .apt-cache/ 2>/dev/null || true
          fi
          sudo dpkg -i -E .apt-cache/*.deb || sudo apt-get -f install -y

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.11-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.11-

      - name: Install Py Dependencies
        run: |
          pip install pytesseract pillow

      - name: Fetch Discord Messages
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python3 src/scan_traan.py

      - name: Push Stock to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_PAT || secrets.GIST_TOKEN }}
        run: |
          git clone "https://${GIST_TOKEN}@gist.github.com/8d7fd9ecd4a4b6ed9e5b101ea84af391.git" gist_stock
          cp data/current_stock.json gist_stock/TraanCurrentStock.json
          cd gist_stock
          git config user.name "${{ steps.bot-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add TraanCurrentStock.json
          git diff --staged --quiet || (git commit -m "AUTO: update traan stock cache" && git push origin HEAD)